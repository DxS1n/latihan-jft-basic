<style>
:root{--bg:#fff;--card:#fff;--ink:#231f20;--mute:#6b6465;--line:#eadfdd;--red:#d92b1e;--red-d:#b01f14;--red-soft:#fdeceb;--ok:#1d7a4a;--ok-soft:#e3f4ea;--ng:#8a1c14;--ng-soft:#fbe4e1;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--red);background:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;flex:none}
.brand b{display:block;line-height:1.2}
.brand small{color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sec{font-weight:700;color:var(--red-d)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:2px solid var(--red);color:var(--red-d);border-radius:999px;padding:2px 14px}
.timer.low{background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(176,31,20,.06)}
.q{font-size:1.25rem;font-weight:700;margin:0 0 6px}
.passage{background:var(--red-soft);border-radius:8px;padding:12px 14px;margin:0 0 14px;white-space:pre-line}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.pic{display:block;max-width:100%;height:auto;border-radius:8px;margin:0 0 14px;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:hover{border-color:var(--red)}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft);border-style:dashed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:2px solid var(--red);border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:#fff;color:var(--red-d)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.stack{display:grid;gap:10px;margin:14px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.dot.done{background:var(--red-soft);border-color:var(--red)}
.dot.cur{outline:3px solid var(--red);outline-offset:1px}
.dot.ok{background:var(--ok-soft);border-color:var(--ok)}
.dot.ng{background:var(--ng-soft);border-color:var(--ng)}
.score{font-size:3rem;font-weight:700;margin:0;color:var(--red-d)}
.exp{margin-top:12px;padding:12px 14px;border-left:4px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0}
h1{font-size:1.6rem;margin:0 0 8px}
.rev{margin-top:16px}
.lab{display:block;font-weight:700;margin:12px 0 4px}
.inp{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea.inp{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;height:300px}
.msg{min-height:1.5em;margin:10px 0 0;color:var(--ng);font-size:.95rem}
.msg.info{color:var(--ok)}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--red-d)}
td.cd{font-weight:700;letter-spacing:.08em;user-select:all}
.big{font-size:2.2rem;font-weight:700;letter-spacing:.15em;text-align:center;color:var(--red-d);background:var(--red-soft);border-radius:10px;padding:14px;margin:14px 0 6px;user-select:all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{background:var(--red-soft);padding:1px 6px;border-radius:4px}
</style>

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function ts(){return firebase.firestore.FieldValue.serverTimestamp()}
function ms(d,k){var t=d[k||"at"];return t&&t.toMillis?t.toMillis():Date.now()}
function dt(n){return new Date(n).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)}
function toEmail(n){n=String(n).trim().toLowerCase().replace(/\s+/g,"_");return /^[a-z0-9_]{2,30}$/.test(n)?n+"@jft.app":null}
function myName(){return user.displayName||user.email.split("@")[0]}
function isAdmin(){return !!user&&user.email===toEmail(ADMIN_NAME)}
function box(html){app.innerHTML='<div class="card">'+html+'</div>'}
function setMsg(t,info){var m=$("msg");if(m){m.textContent=t;m.className="msg"+(info?" info":"")}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function errMsg(e){
  var c=(e&&e.code)||"";
  if(/user-not-found|wrong-password|invalid-credential/.test(c))return "Nama atau password salah.";
  if(c==="auth/email-already-in-use")return "Nama itu sudah dipakai. Coba nama lain.";
  if(c==="auth/weak-password")return "Password minimal 6 karakter.";
  if(c==="auth/operation-not-allowed")return "Login Email/Password belum diaktifkan di Firebase.";
  if(c==="auth/network-request-failed")return "Tidak ada koneksi internet.";
  if(c==="auth/too-many-requests")return "Terlalu banyak percobaan. Coba lagi nanti.";
  if(c==="permission-denied")return "Tidak diizinkan (waktu ujian habis atau Rules belum dipasang).";
  return (e&&e.message)||c||"Terjadi kesalahan.";
}
function parseBank(txt){
  var j=JSON.parse(txt);
  return Array.isArray(j)?{shared:{},questions:j}:{shared:(j&&j.shared)||{},questions:(j&&j.questions)||[]};
}
function checkBank(b){
  var a=b.questions;
  if(!Array.isArray(a)||!a.length)return "Daftar soal (questions) kosong.";
  for(var i=0;i<a.length;i++){var q=a[i],n="Soal "+(i+1)+": ";
    if(!q||!q.type)return n+"type (nama bagian) kosong.";
    if(!q.q)return n+"q (pertanyaan) kosong.";
    if(!Array.isArray(q.o)||q.o.length<2)return n+"o (pilihan) minimal 2.";
    if(!(q.a>=0&&q.a<q.o.length))return n+"a (jawaban benar) di luar pilihan.";
    if(q.use&&!b.shared[q.use])return n+"bacaan bersama bernama "+q.use+" tidak ada di shared.";
  }
  return "";
}
function sub(title,inner,back){box('<h1>'+title+'</h1>'+inner+'<button class="btn ghost" id="bk" style="margin-top:14px">Kembali</button>');$("bk").onclick=back||menu}
function table(head,rows){return '<div class="tw"><table><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join("")+'</tr>'+rows.join("")+'</table></div>'}

// ---------- Masuk / daftar ----------
function login(){
  box('<h1>Masuk</h1><p class="hint">Masuk atau daftar akun baru. Untuk membuka ujian, Anda memerlukan kode dari admin pada hari ujian.</p>'
  +'<label class="lab" for="nm">Nama</label><input class="inp" id="nm" autocomplete="username" autocapitalize="off" placeholder="mis. Wayan Putra">'
  +'<label class="lab" for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="minimal 6 karakter">'
  +'<p class="msg" id="msg" role="alert"></p><div class="nav"><button class="btn ghost" id="reg">Daftar</button><button class="btn" id="in">Masuk</button></div>');
  function go(isReg){
    var nm=$("nm").value.trim(),pw=$("pw").value,em=toEmail(nm);
    if(!em){setMsg("Nama 2-30 karakter, hanya huruf, angka, dan spasi.");return}
    if(!pw){setMsg("Isi password.");return}
    setMsg("Memproses...",1);
    var p=isReg
      ?auth.createUserWithEmailAndPassword(em,pw).then(function(c){return c.user.updateProfile({displayName:nm}).then(function(){user=auth.currentUser;menu()})})
      :auth.signInWithEmailAndPassword(em,pw);
    p.catch(function(e){setMsg(errMsg(e))});
  }
  $("in").onclick=function(){go(false)};
  $("reg").onclick=function(){go(true)};
}

// ---------- Menu ----------
function loadExams(){
  return db.collection("exams").get().then(function(s){
    EXAMS=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return String(a.title).localeCompare(String(b.title))});
    return EXAMS;
  });
}

// ---------- Riwayat dan rekap ----------
function scores(all){
  sub(all?'Nilai semua peserta':'Riwayat nilai saya','<div id="rows" class="hint">Memuat...</div>');
  var qy=all?db.collection("results").limit(500):db.collection("results").where("uid","==",user.uid).limit(200);
  qy.get().then(function(s){
    var r=s.docs.map(function(d){return d.data()}).sort(function(a,b){return ms(b)-ms(a)});
    if(!r.length){$("rows").textContent="Belum ada nilai.";return}
    $("rows").className="";
    $("rows").innerHTML=table((all?['Nama']:[]).concat(['Ujian','Nilai','%','Tanggal']),r.map(function(d){return '<tr>'+(all?'<td>'+esc(d.name)+'</td>':'')+'<td>'+esc(d.title||d.exam||"")+'</td><td>'+d.score+'/'+d.total+'</td><td>'+d.pct+'</td><td>'+dt(ms(d))+'</td></tr>'}));
  }).catch(function(e){$("rows").textContent=errMsg(e)});
}

// ---------- Membuka ujian ----------
function openExam(e){
  ex=e;
  if(isAdmin()){startExam(0);return}
  gid=user.uid+"_"+e.id;
  box('<p class="hint">Memuat...</p>');
  db.collection("grants").doc(gid).get().then(function(s){
    if(s.exists){
      var at=ms(s.data());
      if(lsGet("jft_done_"+gid+"_"+at)==="1"){askCode("Ujian ini sudah Anda selesaikan. Masukkan kode baru dari admin kalau diizinkan mengulang.");return}
      if(Date.now()<at+e.duration*60000){startExam(at);return}
    }
    askCode("");
  }).catch(function(){askCode("")});
}
function askCode(note){
  box('<h1>'+esc(ex.title)+'</h1><p class="hint">'+ex.duration+' menit · '+(ex.count||0)+' soal</p>'+(note?'<p>'+esc(note)+'</p>':'')
  +'<p>Masukkan kode ujian yang diberikan admin. Kode hanya berlaku sebentar, jadi masukkan saat ujian dimulai.</p>'
  +'<label class="lab" for="cd">Kode ujian</label><input class="inp" id="cd" autocapitalize="characters" autocomplete="off" placeholder="mis. K7M2XQ9A">'
  +'<p class="msg" id="msg" role="alert"></p><div class="nav"><button class="btn ghost" id="bk">Kembali</button><button class="btn" id="ok">Mulai ujian</button></div>');
  $("bk").onclick=menu;
  $("ok").onclick=function(){
    var c=$("cd").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(c.length<6){setMsg("Kode terlalu pendek.");return}
    setMsg("Memeriksa kode...",1);
    var ref=db.collection("grants").doc(gid);
    ref.set({uid:user.uid,exam:ex.id,code:c,at:ts()}).then(function(){return ref.get()}).then(function(s){startExam(ms(s.data()))})
      .catch(function(e){setMsg(e.code==="permission-denied"?"Kode salah, sudah kedaluwarsa, sudah pernah dipakai, atau bukan untuk ujian ini.":errMsg(e))});
  };
}
function srcOf(v){if(!v)return "";return v.indexOf("db:")===0?(media[ex.id+v.slice(3)]||""):v}
function preload(){
  var L=[],seen={},P=db.collection("exams").doc(ex.id).collection("private");
  function add(o){if(!o)return;
    if(o.img&&o.img.indexOf("db:")===0)L.push(["img",o.img.slice(3)]);
    if(o.audio&&o.audio.indexOf("db:")===0)L.push(["aud",o.audio.slice(3)])}
  QUESTIONS.forEach(add);Object.keys(SHARED).forEach(function(k){add(SHARED[k])});
  return Promise.all(L.filter(function(x){if(seen[x[1]]||media[ex.id+x[1]])return false;seen[x[1]]=1;return true}).map(function(x){
    if(x[0]==="img")return P.doc("img_"+x[1]).get().then(function(s){if(s.exists)media[ex.id+x[1]]=s.data().data});
    return P.doc("aud_"+x[1]).get().then(function(m){
      if(!m.exists)return;
      var n=m.data().n,ty=m.data().type||"audio/mpeg",ps=[];
      for(var i=0;i<n;i++)ps.push(P.doc("aud_"+x[1]+"_"+i).get());
      return Promise.all(ps).then(function(ss){
        var b64=ss.map(function(s){return s.data().d}).join("");
        return fetch("data:"+ty+";base64,"+b64).then(function(r){return r.blob()}).then(function(bl){media[ex.id+x[1]]=URL.createObjectURL(bl)});
      });
    });
  }));
}
function startExam(atMs){
  box('<p class="hint">Memuat soal dan media...</p>');
  db.collection("exams").doc(ex.id).collection("private").doc("q").get().then(function(s){
    if(!s.exists)throw {message:"Soal untuk ujian ini belum diisi admin."};
    var b=parseBank(s.data().json),er=checkBank(b);
    if(er)throw {message:er};
    QUESTIONS=b.questions;SHARED=b.shared;return preload();
  }).then(function(){
    var total=ex.duration*60;
    left=atMs?Math.min(total,Math.round((atMs+total*1000-Date.now())/1000)):total;
    if(left<=0){box('<h1>Waktu habis</h1><p>Waktu ujian ini sudah berakhir.</p><button class="btn" id="bk">Kembali</button>');$("bk").onclick=menu;return}
    skey=atMs?gid+"_"+atMs:null;
    ans=QUESTIONS.map(function(){return -1});
    if(skey){try{var sv=JSON.parse(lsGet("jft_ans_"+skey));if(sv&&sv.length===ans.length)ans=sv}catch(e){}}
    cur=0;finished=false;savedMsg=atMs?"Menyimpan nilai...":"Mode percobaan admin: nilai tidak disimpan.";
    clearInterval(tick);
    tick=setInterval(function(){left--;var t=$("t");if(t){t.textContent=fmt(left);t.className="timer"+(left<300?" low":"")}if(left<=0)finish()},1000);
    renderQ();
  }).catch(function(e){box('<h1>Tidak bisa membuka ujian</h1><p>'+esc(errMsg(e))+'</p><button class="btn" id="bk">Kembali</button>');$("bk").onclick=menu});
}

// ---------- Mengerjakan ----------
function grid(review){
  return '<div class="grid">'+QUESTIONS.map(function(q,i){
    var c="dot";
    if(review)c+=ans[i]===q.a?" ok":" ng";else if(ans[i]>=0)c+=" done";
    if(i===cur)c+=" cur";
    return '<button class="'+c+'" data-i="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>';
  }).join("")+'</div>';
}
function bindGrid(fn){[].forEach.call(document.querySelectorAll(".dot"),function(b){b.onclick=function(){cur=+b.dataset.i;fn()}})}
function sayBtn(tx){sayList.push(tx);return '<p><button class="btn ghost say" data-k="'+(sayList.length-1)+'">Putar suara</button></p>'}
function matHtml(o){
  if(!o)return "";var h="";
  if(o.audio){var s=srcOf(o.audio);h+=s?'<audio controls preload="auto" src="'+esc(s)+'" style="width:100%;margin:0 0 14px"></audio>':'<p class="hint">Audio tidak dapat dimuat.</p>'}
  if(o.say)h+=sayBtn(o.say);
  if(o.img){var im=srcOf(o.img);if(im)h+='<img class="pic" src="'+esc(im)+'" alt="Gambar soal">'}
  if(o.passage)h+='<p class="passage">'+esc(o.passage)+'</p>';
  return h;
}
function qMat(q){return matHtml(q.use&&SHARED[q.use])+matHtml(q)}
function bindSay(){
  [].forEach.call(document.querySelectorAll(".say"),function(b){b.onclick=function(){
    if(!("speechSynthesis" in window)){alert("Perangkat ini tidak mendukung suara bawaan.");return}
    speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(sayList[+b.dataset.k]);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}});
}
function renderQ(){
  var q=QUESTIONS[cur],h='';sayList=[];
  h+='<div class="bar"><span class="sec">'+esc(q.type)+'</span><span id="t" class="timer'+(left<300?" low":"")+'">'+fmt(left)+'</span></div>';
  h+='<div class="card"><p class="hint">'+esc(ex.title)+' · Soal '+(cur+1)+' dari '+QUESTIONS.length+'</p>';
  h+=qMat(q);
  h+='<p class="q" style="white-space:pre-line">'+esc(q.q)+'</p>';
  h+=q.o.map(function(o,i){return '<button class="opt'+(ans[cur]===i?' sel':'')+'" data-i="'+i+'">'+(i+1)+'. '+esc(o)+'</button>'}).join("");
  h+='<div class="nav"><button class="btn ghost" id="prev"'+(cur===0?' disabled':'')+'>Sebelumnya</button>';
  h+=cur===QUESTIONS.length-1?'<button class="btn" id="end">Selesai</button>':'<button class="btn" id="next">Berikutnya</button>';
  h+='</div></div>'+grid(false);
  app.innerHTML=h;
  [].forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[cur]=+b.dataset.i;if(skey)lsSet("jft_ans_"+skey,JSON.stringify(ans));renderQ()}});
  $("prev").onclick=function(){cur--;renderQ()};
  var n=$("next");if(n)n.onclick=function(){cur++;renderQ()};
  var e=$("end");if(e)e.onclick=function(){
    var un=ans.filter(function(x){return x<0}).length;
    if(un&&!confirm(un+" soal belum dijawab. Tetap selesaikan?"))return;finish()};
  bindSay();bindGrid(renderQ);
}
function calc(){return QUESTIONS.filter(function(q,i){return ans[i]===q.a}).length}
function setSaved(t){savedMsg=t;var s=$("saved");if(s)s.textContent=t}
function finish(){
  if(finished)return;finished=true;clearInterval(tick);if(window.speechSynthesis)speechSynthesis.cancel();cur=0;
  var ok=calc(),n=QUESTIONS.length;
  if(skey)lsSet("jft_done_"+skey,"1");
  renderResult();
  if(!skey)return;
  db.collection("results").add({uid:user.uid,name:myName(),exam:ex.id,title:ex.title,score:ok,total:n,pct:Math.round(ok/n*100),at:ts()})
    .then(function(){setSaved("Nilai tersimpan.")})
    .catch(function(e){setSaved("Nilai gagal disimpan: "+errMsg(e))});
}
function renderResult(){
  var ok=calc(),n=QUESTIONS.length;sayList=[];
  var q=QUESTIONS[cur],h='<div class="card"><h1>Hasil: '+esc(ex.title)+'</h1><p class="score">'+ok+' / '+n+'</p><p class="hint">Benar '+Math.round(ok/n*100)+'%. <span id="saved">'+esc(savedMsg)+'</span> Ketuk nomor di bawah untuk melihat pembahasan.</p><button class="btn" id="again">Kembali ke menu</button></div>';
  h+=grid(true);
  h+='<div class="card rev"><p class="hint">Soal '+(cur+1)+' · '+esc(q.type)+'</p>'+qMat(q);
  h+='<p class="q" style="white-space:pre-line">'+esc(q.q)+'</p>';
  h+=q.o.map(function(o,i){var c="opt";if(i===q.a)c+=" ok";else if(i===ans[cur])c+=" ng";return '<div class="'+c+'">'+(i+1)+'. '+esc(o)+(i===q.a?' ✓':i===ans[cur]?' ✗ (jawaban Anda)':'')+'</div>'}).join("");
  h+='<div class="exp"><strong>'+(ans[cur]===q.a?'Benar.':ans[cur]<0?'Tidak dijawab.':'Salah.')+'</strong> '+esc(q.e||"")+'</div></div>';
  app.innerHTML=h;
  $("again").onclick=menu;
  bindSay();bindGrid(renderResult);
}

function compress(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();
      im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};
      im.onerror=function(){rej({message:"File itu bukan gambar."})};im.src=r.result};
    r.onerror=function(){rej({message:"Gagal membaca file."})};r.readAsDataURL(f);
  });
}
function uploadAudio(f,id){
  return new Promise(function(res,rej){
    if(f.size>8*1024*1024){rej({message:"Audio maksimal 8 MB. Perkecil dulu (mis. mono 64 kbps)."});return}
    var r=new FileReader();
    r.onerror=function(){rej({message:"Gagal membaca file."})};
    r.onload=function(){
      var b64=String(r.result).split(",")[1]||"",ty=f.type||"audio/mpeg",CH=600000,n=Math.ceil(b64.length/CH),aid="a"+Date.now().toString(36),P=db.collection("exams").doc(id).collection("private"),p=Promise.resolve();
      if(/m4a|mp4|aac/.test(ty))ty="audio/mp4";
      for(var i=0;i<n;i++)(function(k){p=p.then(function(){setMsg("Mengunggah audio "+(k+1)+"/"+n+"...",1);return P.doc("aud_"+aid+"_"+k).set({d:b64.slice(k*CH,(k+1)*CH)})})})(i);
      p.then(function(){return P.doc("aud_"+aid).set({n:n,type:ty})}).then(function(){res(aid)}).catch(rej);
    };
    r.readAsDataURL(f);
  });
}

function genCode(){
  var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8)),s="";
  for(var i=0;i<8;i++)s+=A[r[i]%A.length];
  return s;
}

        $("newc").innerHTML='<div class="big">'+c+'</div><p class="hint" style="text-align:center">'+esc(x.title)+' · berlaku sampai '+dt(exp)+'</p>';
        list2();
      }).catch(function(er){setMsg(errMsg(er))});
    };
    list2();
  }).catch(function(e){$("fm").textContent=errMsg(e)});
  function list2(){
    db.collection("codes").orderBy("createdAt","desc").limit(30).get().then(function(s){
      var r=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      $("rows").innerHTML=r.length?table(['Kode','Ujian','Catatan','Status'],r.map(function(x){var e2=x.expiresAt&&x.expiresAt.toMillis?x.expiresAt.toMillis():0;return '<tr><td class="cd">'+x.id+'</td><td>'+esc(x.examTitle||x.exam)+'</td><td>'+esc(x.label||"")+'</td><td>'+(e2>Date.now()?'Aktif sampai '+dt(e2):'Kedaluwarsa')+'</td></tr>'})):'';
    }).catch(function(){});
  }
}

// ---------- Mulai ----------
$("bn").textContent=LPK_NAME;
if(!FIREBASE_CONFIG.apiKey||typeof firebase==="undefined"){
  box('<h1>Firebase belum diisi</h1><p>Isi <code>FIREBASE_CONFIG</code> di bagian atas kode, lalu muat ulang halaman ini.</p>');
}else{
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();
  $("outTop").onclick=function(){auth.signOut()};
  auth.onAuthStateChanged(function(u){user=u;clearInterval(tick);$("outTop").hidden=!u;if(u)menu();else login()});
}
</script>
