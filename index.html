<style>
:root{--bg:#fff;--card:#fff;--ink:#231f20;--mute:#6b6465;--line:#eadfdd;--red:#d92b1e;--red-d:#b01f14;--red-soft:#fdeceb;--ok:#1d7a4a;--ok-soft:#e3f4ea;--ng:#8a1c14;--ng-soft:#fbe4e1;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--red);background:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;flex:none}
.brand b{display:block;line-height:1.2}
.brand small{color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sec{font-weight:700;color:var(--red-d)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:2px solid var(--red);color:var(--red-d);border-radius:999px;padding:2px 14px}
.timer.low{background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(176,31,20,.06)}
.q{font-size:1.25rem;font-weight:700;margin:0 0 6px}
.passage{background:var(--red-soft);border-radius:8px;padding:12px 14px;margin:0 0 14px;white-space:pre-line}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.pic{display:block;max-width:100%;height:auto;border-radius:8px;margin:0 0 14px;border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:hover{border-color:var(--red)}
.opt.sel{border-color:var(--red);background:var(--red-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft);border-style:dashed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:2px solid var(--red);border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:#fff;color:var(--red-d)}
.btn.ghost:hover{background:var(--red-soft)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.stack{display:grid;gap:10px;margin:14px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;cursor:pointer}
.dot.done{background:var(--red-soft);border-color:var(--red)}
.dot.cur{outline:3px solid var(--red);outline-offset:1px}
.dot.ok{background:var(--ok-soft);border-color:var(--ok)}
.dot.ng{background:var(--ng-soft);border-color:var(--ng)}
.score{font-size:3rem;font-weight:700;margin:0;color:var(--red-d)}
.exp{margin-top:12px;padding:12px 14px;border-left:4px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0}
h1{font-size:1.6rem;margin:0 0 8px}
.rev{margin-top:16px}
.lab{display:block;font-weight:700;margin:12px 0 4px}
.inp{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea.inp{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;height:300px}
.msg{min-height:1.5em;margin:10px 0 0;color:var(--ng);font-size:.95rem}
.msg.info{color:var(--ok)}
.tw{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--red-d)}
td.cd{font-weight:700;letter-spacing:.08em;user-select:all}
.big{font-size:2.2rem;font-weight:700;letter-spacing:.15em;text-align:center;color:var(--red-d);background:var(--red-soft);border-radius:10px;padding:14px;margin:14px 0 6px;user-select:all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{background:var(--red-soft);padding:1px 6px;border-radius:4px}
</style>

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fmt(s){var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}

function ms(d,k){var t=d[k||"at"];return t&&t.toMillis?t.toMillis():Date.now()}
function dt(n){return new Date(n).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"})}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)}

function errMsg(e){
  var c=(e&&e.code)||"";
  if(/user-not-found|wrong-password|invalid-credential/.test(c))return "Username atau password salah. Periksa ejaan username dan password Anda.";
  if(c==="auth/email-already-in-use")return "Username itu sudah dipakai. Kalau itu akun Anda, ketuk Masuk. Kalau bukan, pakai username lain (mis. tambahkan angka).";
  if(c==="auth/weak-password")return "Password minimal 6 karakter.";
  if(c==="auth/operation-not-allowed")return "Login Email/Password belum diaktifkan di Firebase.";
  if(c==="auth/network-request-failed")return "Tidak ada koneksi internet.";
  if(c==="auth/too-many-requests")return "Terlalu banyak percobaan. Coba lagi nanti.";
  if(c==="permission-denied")return "Tidak diizinkan (waktu ujian habis atau Rules belum dipasang).";
  return (e&&e.message)||c||"Terjadi kesalahan.";
}
function parseBank(txt){
  var j=JSON.parse(txt);
  return Array.isArray(j)?{shared:{},questions:j}:{shared:(j&&j.shared)||{},questions:(j&&j.questions)||[]};
}
function checkBank(b){
  var a=b.questions;
  if(!Array.isArray(a)||!a.length)return "Daftar soal (questions) kosong.";
  for(var i=0;i<a.length;i++){var q=a[i],n="Soal "+(i+1)+": ";
    if(!q||!q.type)return n+"type (nama bagian) kosong.";
    if(!q.q)return n+"q (pertanyaan) kosong.";
    if(!Array.isArray(q.o)||q.o.length<2)return n+"o (pilihan) minimal 2.";
    if(!(q.a>=0&&q.a<q.o.length))return n+"a (jawaban benar) di luar pilihan.";
    if(q.use&&!b.shared[q.use])return n+"bacaan bersama bernama "+q.use+" tidak ada di shared.";
  }
  return "";
}

function useCode(c){

    return db.collection("exams").doc(x.exam).get().then(function(es){
      if(!es.exists)throw {message:"Ujian untuk kode ini sudah tidak ada."};
      ex=es.data();ex.id=es.id;gid=user.uid+"_"+ex.id;cinfo={code:c,label:x.label||""};
      var ref=db.collection("grants").doc(gid);
      return ref.get().then(function(g){

          var at=ms(g.data());
          return db.collection("results").where("uid","==",user.uid).where("code","==",c).limit(1).get().then(function(rs){
            if(!rs.empty||lsGet("jft_done_"+gid+"_"+at)==="1")throw {message:"Anda sudah menyelesaikan ujian ini dengan kode tersebut."};
            if(Date.now()<at+ex.duration*60000){startExam(at);return}

      });
    });
  }).catch(function(e){setMsg(e.code==="permission-denied"?"Kode ditolak: sudah kedaluwarsa atau sudah dipakai.":errMsg(e))});
}

function srcOf(v){if(!v)return "";return v.indexOf("db:")===0?(media[ex.id+v.slice(3)]||""):v}
function preload(){
  var L=[],seen={},P=db.collection("exams").doc(ex.id).collection("private");
  function add(o){if(!o)return;
    if(o.img&&o.img.indexOf("db:")===0)L.push(["img",o.img.slice(3)]);
    if(o.audio&&o.audio.indexOf("db:")===0)L.push(["aud",o.audio.slice(3)])}
  QUESTIONS.forEach(add);Object.keys(SHARED).forEach(function(k){add(SHARED[k])});
  return Promise.all(L.filter(function(x){if(seen[x[1]]||media[ex.id+x[1]])return false;seen[x[1]]=1;return true}).map(function(x){
    if(x[0]==="img")return P.doc("img_"+x[1]).get().then(function(s){if(s.exists)media[ex.id+x[1]]=s.data().data});
    return P.doc("aud_"+x[1]).get().then(function(m){
      if(!m.exists)return;
      var n=m.data().n,ty=m.data().type||"audio/mpeg",ps=[];
      for(var i=0;i<n;i++)ps.push(P.doc("aud_"+x[1]+"_"+i).get());
      return Promise.all(ps).then(function(ss){
        var b64=ss.map(function(s){return s.data().d}).join("");
        return fetch("data:"+ty+";base64,"+b64).then(function(r){return r.blob()}).then(function(bl){media[ex.id+x[1]]=URL.createObjectURL(bl)});
      });
    });
  }));
}

function calc(){return QUESTIONS.filter(function(q,i){return ans[i]===q.a}).length}
var SEC_NAME={moji:"Moji・Goi (tulisan dan kosakata)",bunpou:"Bunpou (tata bahasa)",dokkai:"Dokkai (membaca)",chokai:"Chokai (mendengarkan)",kaiwa:"Kaiwa・Hyougen (percakapan dan ekspresi)",lain:"Tanpa bagian"};
var SEC_SHORT={moji:"Moji・Goi",bunpou:"Bunpou",dokkai:"Dokkai",chokai:"Chokai",kaiwa:"Kaiwa",lain:"Lain"};
var SEC_ORDER=["moji","bunpou","dokkai","chokai","kaiwa","lain"];
var G45=[{n:"Bahasa dan Membaca (Moji・Goi・Bunpou・Dokkai)",s:["moji","bunpou","dokkai"],max:120,min:38},{n:"Chokai",s:["chokai"],max:60,min:19}];
var G3=[{n:"Moji・Goi・Bunpou",s:["moji","bunpou"],max:60,min:19},{n:"Dokkai",s:["dokkai"],max:60,min:19},{n:"Chokai",s:["chokai"],max:60,min:19}];
var SCHEMES={jft:{name:"JFT-Basic"},n5:{name:"JLPT N5",pass:80,g:G45},n4:{name:"JLPT N4",pass:90,g:G45},n3:{name:"JLPT N3",pass:95,g:G3},n2:{name:"JLPT N2",pass:90,g:G3},n1:{name:"JLPT N1",pass:100,g:G3}};
function secOf(q){
  if(q.sec&&SEC_NAME[q.sec])return q.sec;
  var t=String(q.type).toLowerCase();
  if(/chokai|choukai|dengar|listening/.test(t))return "chokai";
  if(/dokkai|baca|reading|membaca/.test(t))return "dokkai";
  if(/bunpou|bunpo|tata bahasa|grammar/.test(t))return "bunpou";
  if(/percakapan|ekspresi|kaiwa|conversation/.test(t))return "kaiwa";
  if(/moji|goi|kosakata|kanji|vocab|tulisan|script/.test(t))return "moji";
  return "";
}
function evaluate(){
  var by={},n=QUESTIONS.length,raw=calc();
  QUESTIONS.forEach(function(q,i){var s=secOf(q)||"lain";by[s]=by[s]||{c:0,t:0};by[s].t++;if(ans[i]===q.a)by[s].c++});
  var r={by:by,raw:raw,n:n,score:raw,max:n,res:"",note:"",info:"",groups:null,scaled:false},sc=SCHEMES[ex.scheme];
  if(!sc)return r;
  function frac(k){return by[k]&&by[k].t?by[k].c/by[k].t:null}
  if(ex.scheme==="jft"){
    var ks=["moji","kaiwa","chokai","dokkai"],miss=ks.filter(function(k){return frac(k)===null});
    if(miss.length){r.note="Skor JFT tidak bisa dihitung karena belum ada soal untuk bagian: "+miss.map(function(k){return SEC_SHORT[k]}).join(", ")+". Atur kode sec pada soal.";return r}
    var p=ks.reduce(function(a,k){return a+frac(k)},0)/ks.length,s=Math.round(10+240*p);
    r.scaled=true;r.score=s;r.max=250;
    r.res=s>=200?"A2.2 (A2) · LULUS":s>=175?"A2.1":s>=145?"A1":"Belum mencapai level (*)";
    r.info="Batas level: A1 mulai 145, A2.1 mulai 175, A2.2 (A2, lulus) mulai 200, dari skala 10 sampai 250.";
    return r;
  }
  var tot=0,why=[],miss2=[];
  r.groups=sc.g.map(function(g){
    var c=0,t=0;g.s.forEach(function(k){if(by[k]){c+=by[k].c;t+=by[k].t}});
    if(!t){miss2.push(g.n);return {n:g.n,sc:0,max:g.max,min:g.min}}
    var v=Math.round(c/t*g.max);tot+=v;if(v<g.min)why.push(g.n);
    return {n:g.n,sc:v,max:g.max,min:g.min};
  });
  if(miss2.length){r.note="Skor "+sc.name+" tidak bisa dihitung karena belum ada soal untuk: "+miss2.join(", ")+". Atur kode sec pada soal.";r.groups=null;return r}
  var pass=!why.length&&tot>=sc.pass;
  r.scaled=true;r.score=tot;r.max=180;r.res=pass?"LULUS":"TIDAK LULUS";
  r.info="Syarat lulus "+sc.name+": total minimal "+sc.pass+" dari 180 dan setiap bagian minimal batasnya"+(why.length?". Di bawah batas: "+why.join(", "):"")+".";
  return r;
}
function setSaved(t){savedMsg=t;var s=$("saved");if(s)s.textContent=t}
function finish(){
  if(finished)return;finished=true;clearInterval(tick);if(window.speechSynthesis)speechSynthesis.cancel();cur=0;
  RES=evaluate();
  if(skey)lsSet("jft_done_"+skey,"1");
  renderResult();
  if(!skey)return;
  db.collection("results").add({uid:user.uid,name:myName(),username:uname(),exam:ex.id,folder:ex.folder||"",code:cinfo.code||"",codeLabel:cinfo.label||"",grantAt:gAt,title:ex.title,scheme:ex.scheme||"",score:RES.score,total:RES.max,pct:Math.round(RES.raw/RES.n*100),res:RES.res||"",secs:RES.by,at:ts()})
    .then(function(){setSaved("Nilai tersimpan.")})
    .catch(function(e){setSaved("Nilai gagal disimpan: "+errMsg(e))});
}
function renderResult(){
  var R=RES,n=QUESTIONS.length;sayList=[];
  var q=QUESTIONS[cur],h='<div class="card"><h1>Hasil: '+esc(ex.title)+'</h1><p class="score">'+R.score+' / '+R.max+'</p>';

  h+=table(['Kemampuan','Benar','%'],SEC_ORDER.filter(function(k){return R.by[k]}).map(function(k){var b=R.by[k];return '<tr><td>'+esc(SEC_NAME[k])+'</td><td>'+b.c+' / '+b.t+'</td><td>'+Math.round(b.c/b.t*100)+'%</td></tr>'}));
  h+='<p class="hint">Benar '+R.raw+' dari '+n+' soal. <span id="saved">'+esc(savedMsg)+'</span>'+(R.scaled?' Skor ini perkiraan untuk latihan. Skor resmi memakai penskalaan statistik (equating), jadi angka aslinya bisa berbeda.':'')+' Ketuk nomor di bawah untuk melihat pembahasan.</p><button class="btn" id="again">Kembali ke menu</button></div>';
  h+=grid(true);
  h+='<div class="card rev"><p class="hint">Soal '+(cur+1)+' · '+esc(q.type)+'</p>'+qMat(q);
  h+='<p class="q" style="white-space:pre-line">'+esc(q.q)+'</p>';
  h+=q.o.map(function(o,i){var c="opt";if(i===q.a)c+=" ok";else if(i===ans[cur])c+=" ng";return '<div class="'+c+'">'+(i+1)+'. '+esc(o)+(i===q.a?' ✓':i===ans[cur]?' ✗ (jawaban Anda)':'')+'</div>'}).join("");
  h+='<div class="exp"><strong>'+(ans[cur]===q.a?'Benar.':ans[cur]<0?'Tidak dijawab.':'Salah.')+'</strong> '+esc(q.e||"")+'</div></div>';
  app.innerHTML=h;
  $("again").onclick=menu;
  bindSay();bindGrid(renderResult);
}

function compress(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();
      im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};
      im.onerror=function(){rej({message:"File itu bukan gambar."})};im.src=r.result};
    r.onerror=function(){rej({message:"Gagal membaca file."})};r.readAsDataURL(f);
  });
}
function uploadAudio(f,id){
  return new Promise(function(res,rej){
    if(f.size>8*1024*1024){rej({message:"Audio maksimal 8 MB. Perkecil dulu (mis. mono 64 kbps)."});return}
    var r=new FileReader();
    r.onerror=function(){rej({message:"Gagal membaca file."})};
    r.onload=function(){
      var b64=String(r.result).split(",")[1]||"",ty=f.type||"audio/mpeg",CH=600000,n=Math.ceil(b64.length/CH),aid="a"+Date.now().toString(36),P=db.collection("exams").doc(id).collection("private"),p=Promise.resolve();
      if(/m4a|mp4|aac/.test(ty))ty="audio/mp4";
      for(var i=0;i<n;i++)(function(k){p=p.then(function(){setMsg("Mengunggah audio "+(k+1)+"/"+n+"...",1);return P.doc("aud_"+aid+"_"+k).set({d:b64.slice(k*CH,(k+1)*CH)})})})(i);
      p.then(function(){return P.doc("aud_"+aid).set({n:n,type:ty})}).then(function(){res(aid)}).catch(rej);
    };
    r.readAsDataURL(f);
  });
}
function editExam(e){
  sub(e?'Ubah ujian':'Ujian baru',
   '<label class="lab" for="ti">Judul ujian</label><input class="inp" id="ti" placeholder="mis. JLPT N5 Paket 1"'+(e?' disabled':'')+'>'
  +'<label class="lab" for="du">Durasi (menit, maksimal 125)</label><input class="inp" id="du" type="number" min="1" max="125">'
  +'<label class="lab" for="fd">Folder</label><select class="inp" id="fd">'+FOLDERS.map(function(f){return '<option>'+esc(f)+'</option>'}).join("")+'</select>'
  +'<label class="lab" for="sc">Sistem penilaian</label><select class="inp" id="sc"><option value="">Biasa (jumlah benar)</option><option value="jft">JFT-Basic (skala 10-250, level A1/A2.1/A2.2)</option><option value="n5">JLPT N5 (skala 180)</option><option value="n4">JLPT N4 (skala 180)</option><option value="n3">JLPT N3 (skala 180)</option><option value="n2">JLPT N2 (skala 180)</option><option value="n1">JLPT N1 (skala 180)</option></select>'
  +'<label class="lab" for="js">Daftar soal (JSON)</label><textarea class="inp" id="js" spellcheck="false" autocapitalize="off"></textarea>'
  +'<p class="hint" style="margin-top:6px">Tiap soal: type (nama bagian yang tampil), sec (moji, bunpou, dokkai, chokai, atau kaiwa untuk JFT), q, o (pilihan), a (nomor jawaban benar, mulai dari 0), e (pembahasan). Bacaan, audio, dan gambar bisa dipasang lewat dua kotak di bawah.</p>'
  +'<label class="lab">Bacaan bersama (satu cerita untuk beberapa soal)</label>'
  +'<div class="row"><input class="inp" id="mn" placeholder="Nama, mis. cerita1" style="width:160px"><input class="inp" id="mf" type="number" min="1" placeholder="Dari soal" style="width:110px"><input class="inp" id="mt" type="number" min="1" placeholder="Sampai" style="width:100px"></div>'
  +'<textarea class="inp" id="mp" style="height:90px;font-family:inherit;font-size:1rem;margin-top:8px" placeholder="Tempel teks cerita di sini (boleh kosong kalau hanya untuk audio atau gambar bersama)"></textarea>'
  +'<button class="btn ghost sm" id="pm" style="margin-top:8px">Pasang ke soal</button>'
  +'<label class="lab">Lampirkan gambar atau audio</label>'
  +'<div class="row"><input class="inp" id="qn" placeholder="No. soal atau nama bacaan" style="width:230px"><input id="fi" type="file" accept="image/*,audio/*"></div>'
  +'<button class="btn ghost sm" id="up" style="margin-top:8px">Unggah dan lampirkan</button>'
  +'<p class="msg" id="msg" role="alert"></p><button class="btn" id="sv">Simpan ujian</button>',adminExams);
  $("ti").value=e?e.title:"";$("du").value=e?e.duration:DEFAULT_DURATION;$("sc").value=e&&e.scheme?e.scheme:"";$("fd").value=e&&e.folder?e.folder:"Lainnya";
  $("js").addEventListener("input",function(){
    if(e)return;
    try{var j=JSON.parse(this.value),m=j&&j.meta;if(!m)return;
      if(m.title)$("ti").value=m.title;
      if(m.duration)$("du").value=m.duration;
      if(m.folder)$("fd").value=m.folder;
      if(m.scheme!==undefined)$("sc").value=m.scheme;
    }catch(x){}
  });
  function eid(){return e?e.id:slug($("ti").value)}
  function getB(){try{return parseBank($("js").value)}catch(x){setMsg("Format JSON salah: "+x.message);return null}}
  function putB(b){$("js").value=JSON.stringify(b,null,1)}
  if(e){
    $("js").value="Memuat soal...";
    db.collection("exams").doc(e.id).collection("private").doc("q").get().then(function(s){putB(s.exists?parseBank(s.data().json):{shared:{},questions:[]})}).catch(function(x){$("js").value="";setMsg(errMsg(x))});
  }else putB(SAMPLE);
  $("pm").onclick=function(){
    var b=getB();if(!b)return;
    var nm=$("mn").value.trim(),f=parseInt($("mf").value),t2=parseInt($("mt").value)||f,tx=$("mp").value.trim();
    if(!/^[A-Za-z0-9_-]+$/.test(nm)){setMsg("Nama bacaan hanya boleh huruf, angka, - atau _.");return}
    if(!f||f<1||t2<f||t2>b.questions.length){setMsg("Rentang soal tidak valid (jumlah soal: "+b.questions.length+").");return}
    b.shared[nm]=b.shared[nm]||{};if(tx)b.shared[nm].passage=tx;
    for(var i=f-1;i<t2;i++)b.questions[i].use=nm;
    putB(b);setMsg("Bacaan "+nm+" terpasang di soal "+f+" sampai "+t2+". Tekan Simpan ujian.",1);
  };
  $("up").onclick=function(){
    var fl=$("fi").files[0],tg=$("qn").value.trim(),id=eid();
    if(!id){setMsg("Isi judul ujian dulu.");return}
    if(!fl||!tg){setMsg("Isi tujuan (nomor soal atau nama bacaan) dan pilih file.");return}
    var b=getB();if(!b)return;
    var target;
    if(/^\d+$/.test(tg)){target=b.questions[+tg-1];if(!target){setMsg("Soal nomor "+tg+" tidak ada.");return}}
    else{if(!b.shared[tg]){setMsg("Bacaan bernama "+tg+" belum ada. Buat dulu lewat Bacaan bersama.");return}target=b.shared[tg]}
    var isA=/^audio\//.test(fl.type)||/\.(mp3|m4a|wav|aac)$/i.test(fl.name),isI=/^image\//.test(fl.type);
    if(!isA&&!isI){setMsg("File harus berupa gambar atau audio (mp3 atau m4a).");return}
    setMsg("Mengunggah...",1);
    (isA?uploadAudio(fl,id):compress(fl).then(function(d){var g="g"+Date.now().toString(36);return db.collection("exams").doc(id).collection("private").doc("img_"+g).set({data:d}).then(function(){return g})}))
      .then(function(k){target[isA?"audio":"img"]="db:"+k;putB(b);setMsg((isA?"Audio":"Gambar")+" terpasang di "+tg+". Tekan Simpan ujian.",1)})
      .catch(function(x){setMsg(errMsg(x))});
  };
  $("sv").onclick=function(){
    var id=eid();
    if(!id){setMsg("Isi judul ujian.");return}
    var b=getB();if(!b)return;
    var er=checkBank(b);if(er){setMsg(er);return}
    var d=Math.min(125,Math.max(1,parseInt($("du").value)||DEFAULT_DURATION)),bt=db.batch(),ref=db.collection("exams").doc(id);
    bt.set(ref,{title:e?e.title:$("ti").value.trim(),duration:d,scheme:$("sc").value,folder:$("fd").value,count:b.questions.length,at:ts()});
    bt.set(ref.collection("private").doc("q"),{json:JSON.stringify(b)});
    setMsg("Menyimpan...",1);
    bt.commit().then(function(){setMsg("Tersimpan: "+b.questions.length+" soal.",1)}).catch(function(x){setMsg(errMsg(x))});
  };
}

// ---------- Admin: kode ujian ----------
function genCode(){
  var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8)),s="";
  for(var i=0;i<8;i++)s+=A[r[i]%A.length];
  return s;
}
function codes(){
  sub('Kode ujian','<p class="hint">Setiap kali Anda menekan tombol, dibuat kode baru yang berbeda. Siswa memasukkan kode ini setelah login dan langsung masuk ke ujiannya.</p><div id="fm" class="hint">Memuat...</div><div id="rows"></div>');
  var CL=[];
  loadExams().then(function(list){
    if(!list.length){$("fm").textContent="Buat ujian dulu di menu Ujian dan soal.";return}
    $("fm").className="";
    $("fm").innerHTML='<label class="lab" for="ce">Ujian</label><select class="inp" id="ce">'+byFolder(list).map(function(g){return '<optgroup label="'+esc(g.f)+'">'+g.items.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>'}).join("")+'</optgroup>'}).join("")+'</select>'
    +'<label class="lab" for="cv">Berlaku selama</label><select class="inp" id="cv"><option value="15">15 menit</option><option value="30" selected>30 menit</option><option value="60">60 menit</option><option value="120">120 menit</option></select>'
    +'<label class="lab" for="cl">Catatan, mis. nama kelas (opsional)</label><input class="inp" id="cl" placeholder="mis. Kelas A, sesi pagi">'
    +'<p class="msg" id="msg" role="alert"></p><button class="btn" id="mk">Buat kode baru</button><div id="newc"></div>';
    $("mk").onclick=function(){
      var x=list.filter(function(y){return y.id===$("ce").value})[0],m=+$("cv").value,c=genCode(),exp=Date.now()+m*60000;
      setMsg("Membuat kode...",1);
      db.collection("codes").doc(c).set({exam:x.id,examTitle:x.title,folder:x.folder,label:$("cl").value.trim(),createdAt:ts(),expiresAt:firebase.firestore.Timestamp.fromMillis(exp)}).then(function(){
        setMsg("",1);
        $("newc").innerHTML='<div class="big">'+c+'</div><p class="hint" style="text-align:center">'+esc(x.title)+' · berlaku sampai '+dt(exp)+'</p><button class="btn ghost sm" id="cp">Salin kode</button>';
        $("cp").onclick=function(){try{navigator.clipboard.writeText(c)}catch(er){}this.textContent="Tersalin"};
        list2();
      }).catch(function(er){setMsg(errMsg(er))});
    };
    list2();
  }).catch(function(e){$("fm").textContent=errMsg(e)});
  function list2(){
    db.collection("codes").orderBy("createdAt","desc").limit(50).get().then(function(s){
      CL=s.docs.map(function(d){var x=d.data();x.id=d.id;x.exp=x.expiresAt&&x.expiresAt.toMillis?x.expiresAt.toMillis():0;return x});
      var old=CL.filter(function(x){return x.exp<=Date.now()}).length;
      $("rows").innerHTML=CL.length?table(['Kode','Ujian','Catatan','Status',''],CL.map(function(x){return '<tr><td class="cd">'+x.id+'</td><td>'+esc(x.examTitle||x.exam)+'</td><td>'+esc(x.label||"")+'</td><td>'+(x.exp>Date.now()?'Aktif sampai '+dt(x.exp):'Kedaluwarsa')+'</td><td><button class="btn sm" data-a="d" data-c="'+x.id+'">Unduh</button> <button class="btn ghost sm" data-a="n" data-c="'+x.id+'">Nilai</button> <button class="btn ghost sm" data-a="h" data-c="'+x.id+'">Hapus</button></td></tr>'}))+(old?'<button class="btn ghost sm" id="hx">Hapus semua yang kedaluwarsa ('+old+')</button>':''):'';
      [].forEach.call($("rows").querySelectorAll("button[data-c]"),function(b){b.onclick=function(){
        var c=b.dataset.c;
        if(b.dataset.a==="n"){recapCode(c);return}
        if(b.dataset.a==="d"){quickDownload(c);return}
        if(!confirm("Hapus kode "+c+"? Nilai yang sudah tersimpan tidak ikut terhapus."))return;
        db.collection("codes").doc(c).delete().then(list2).catch(function(er){setMsg(errMsg(er))});
      }});
      var hx=$("hx");
      if(hx)hx.onclick=function(){
        if(!confirm("Hapus "+old+" kode yang sudah kedaluwarsa? Nilai yang sudah tersimpan tidak ikut terhapus."))return;
        var bt=db.batch();CL.filter(function(x){return x.exp<=Date.now()}).forEach(function(x){bt.delete(db.collection("codes").doc(x.id))});
        bt.commit().then(list2).catch(function(er){setMsg(errMsg(er))});
      };
    }).catch(function(){});
  }
}

// ---------- Admin: rekap nilai per kode ----------
function recap(){
  sub('Rekap nilai per kode','<p class="hint">Nilai peserta dikelompokkan menurut kode ujian, jadi tidak tercampur antar kelas.</p><div id="rows" class="hint">Memuat...</div>');
  db.collection("results").limit(1000).get().then(function(s){
    var G={};
    s.docs.forEach(function(d){var x=d.data(),k=x.code||"(tanpa kode)";var g=G[k]=G[k]||{code:k,title:x.title||x.exam||"",label:x.codeLabel||"",rows:[],last:0};g.rows.push(x);g.last=Math.max(g.last,ms(x))});
    var L=Object.keys(G).map(function(k){return G[k]}).sort(function(a,b){return b.last-a.last}),r=$("rows");
    if(!L.length){r.textContent="Belum ada nilai.";return}
    r.className="";
    r.innerHTML='<div class="stack">'+L.map(function(g,i){return '<button class="btn ghost" data-i="'+i+'">'+esc(g.code)+' · '+esc(g.title)+(g.label?' · '+esc(g.label):'')+'<br><small>'+g.rows.length+' peserta · terakhir '+dt(g.last)+'</small></button>'}).join("")+'</div>';
    [].forEach.call(r.querySelectorAll("button"),function(b){b.onclick=function(){recapShow(L[+b.dataset.i],recap)}});
  }).catch(function(e){$("rows").textContent=errMsg(e)});
}
function recapCode(c){
  db.collection("results").where("code","==",c).get().then(function(s){
    var rows=s.docs.map(function(d){return d.data()});
    recapShow({code:c,title:rows.length?rows[0].title:"",label:rows.length?rows[0].codeLabel||"":"",rows:rows},codes);
  }).catch(function(e){alert(errMsg(e))});
}
function quickDownload(c){
  db.collection("results").where("code","==",c).get().then(function(s){
    var rows=s.docs.map(function(d){return d.data()}).sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
    if(!rows.length){alert("Belum ada peserta yang menyelesaikan ujian dengan kode ini.");return}
    download({code:c,title:rows[0].title||"",label:rows[0].codeLabel||"",rows:rows},rows,"xlsx");
  }).catch(function(e){alert(errMsg(e))});
}
function recapShow(g,back){
  var rows=g.rows.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
  sub('Kode '+esc(g.code),'<p class="hint">'+esc(g.title||"")+(g.label?' · '+esc(g.label):'')+' · '+rows.length+' peserta</p>'
    +(rows.length?table(['Nama','Username','Nilai','Hasil','Rincian','Waktu'],rows.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.username||"")+'</td><td>'+x.score+'/'+x.total+'</td><td>'+esc(x.res||"-")+'</td><td>'+esc(secText(x.secs))+'</td><td>'+dt(ms(x))+'</td></tr>'}))
    +'<div class="stack"><button class="btn" id="dx">Unduh Excel (.xlsx)</button><button class="btn ghost" id="dc">Unduh CSV</button></div><p class="msg" id="msg" role="alert"></p>':'<p>Belum ada peserta yang menyelesaikan ujian dengan kode ini.</p>'),back);
  if(rows.length){$("dx").onclick=function(){download(g,rows,"xlsx")};$("dc").onclick=function(){download(g,rows,"csv")}}
}
function csvCell(v){v=String(v==null?"":v);return /[",\r\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function loadXlsx(){
  return new Promise(function(res,rej){
    if(window.XLSX){res();return}
    var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
function saveBlob(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function download(g,rows,type){
  var data=[["No","Nama lengkap","Username","Ujian","Kode","Catatan","Skor","Skor maksimal","Hasil","Persen benar","Moji-Goi","Bunpou","Dokkai","Chokai","Kaiwa","Waktu selesai"]].concat(rows.map(function(x,i){
    var s=x.secs||{};function sc(k){return s[k]?s[k].c+"/"+s[k].t:""}
    return [i+1,x.name,x.username||"",x.title||x.exam,x.code||"",x.codeLabel||"",x.score,x.total,x.res||"",x.pct,sc("moji"),sc("bunpou"),sc("dokkai"),sc("chokai"),sc("kaiwa"),dt(ms(x))];
  }));
  var fn="nilai_"+(slug(g.title)||"ujian")+"_"+(String(g.code).replace(/[^A-Za-z0-9]/g,"")||"semua");
  if(type==="csv"){
    saveBlob(new Blob(["\ufeff"+data.map(function(r){return r.map(csvCell).join(",")}).join("\r\n")],{type:"text/csv;charset=utf-8"}),fn+".csv");return;
  }
  setMsg("Menyiapkan file...",1);
  loadXlsx().then(function(){
    var ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();
    ws["!cols"]=data[0].map(function(){return {wch:16}});
    XLSX.utils.book_append_sheet(wb,ws,"Nilai");
    saveBlob(new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),fn+".xlsx");
    setMsg("File diunduh.",1);
  }).catch(function(){setMsg("Pustaka Excel gagal dimuat. Pakai tombol Unduh CSV.")});
}
